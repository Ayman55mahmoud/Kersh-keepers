<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العروض - KERSh KEEPERS</title>
  <meta name="description" content="كرش كيبرز - العروض والخصومات" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="rtl">

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-logo">K</div>
        <div class="brand-text">
          <span class="brand-name">KERSh KEEPERS</span>
          <span class="brand-slogan">SHAWARMA & GRILL</span>
        </div>
      </a>
      <div class="nav-links"></div>
      <div class="nav-actions">
        <button id="lang-switch">English</button>
        <button class="nav-toggle"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1 data-i18n="offers.title">العروض</h1>
    <div class="header-line"></div>
  </div>

  <section class="section">
    <div id="offers-container"></div>
  </section>

  <footer class="footer">
    <div class="footer-brand">KERSh KEEPERS</div>
    <div class="footer-slogan">SHAWARMA & GRILL</div>
    <div class="footer-phone">
      <a href="tel:0504802787">0504802787</a> | 
      <a href="https://wa.me/201220776716" target="_blank">01220776716</a>
    </div>
    <div class="footer-copy">
      &copy; 2026 KERSh KEEPERS — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span>
    </div>
  </footer>

  <div class="sticky-cart" id="sticky-cart">
    <a href="cart.html">
      🛒 <span data-i18n="nav.cart">السلة</span>
      <span class="sticky-badge cart-badge" style="display:none">0</span>
    </a>
  </div>

  <script src="./data/products.js"></script>
  <script src="./js/language.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/whatsapp.js"></script>
  <script src="./js/app.js"></script>
  <script>
    function renderOffers() {
      var container = document.getElementById("offers-container");
      if (!container) return;

      var offers = getOfferProducts();

      if (offers.length === 0) {
        container.innerHTML =
          '<div class="no-offers">' +
            '<div class="icon">🎉</div>' +
            '<h2 data-i18n="offers.noOffers">لا توجد عروض حالياً</h2>' +
            '<p data-i18n="offers.noOffersHint">تابعنا لأحدث العروض والخصومات</p>' +
          '</div>';
        applyLang();
      } else {
        container.innerHTML = "";
        var grid = document.createElement("div");
        grid.className = "offers-grid";
        offers.forEach(function (p) {
          var card = renderProductCard(p);
          grid.appendChild(card);
        });
        container.appendChild(grid);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderOffers();
      var sticky = document.getElementById("sticky-cart");
      if (sticky) sticky.classList.add("show");
      document.addEventListener("langChanged", renderOffers);
    });
  </script>
</body>
</html>
