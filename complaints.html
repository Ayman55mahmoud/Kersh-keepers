<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الشكاوى - KERSh KEEPERS</title>
  <meta name="description" content="كرش كيبرز - الشكاوى والمقترحات" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="rtl">

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-logo">K</div>
        <div class="brand-text">
          <span class="brand-name">KERSh KEEPERS</span>
          <span class="brand-slogan">SHAWARMA & GRILL</span>
        </div>
      </a>
      <div class="nav-links"></div>
      <div class="nav-actions">
        <button id="lang-switch">English</button>
        <button class="nav-toggle"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <div class="complaints-page">
    <div class="page-header">
      <h1 data-i18n="complaints.title">الشكاوى والمقترحات</h1>
      <div class="header-line"></div>
    </div>

    <section class="section">
      <form class="complaints-form" id="complaint-form" onsubmit="return false;">
        <div class="form-group">
          <label data-i18n="complaints.name">الاسم</label>
          <input type="text" id="c-name" required />
          <div class="form-error" id="c-name-error" data-i18n="complaints.nameRequired">الاسم مطلوب</div>
        </div>
        <div class="form-group">
          <label data-i18n="complaints.phone">رقم الهاتف</label>
          <input type="tel" id="c-phone" required />
          <div class="form-error" id="c-phone-error" data-i18n="complaints.phoneRequired">رقم الهاتف مطلوب</div>
        </div>
        <div class="form-group">
          <label data-i18n="complaints.orderNum">رقم الطلب - اختياري</label>
          <input type="text" id="c-order" />
        </div>
        <div class="form-group">
          <label data-i18n="complaints.message">الشكوى / الملاحظة</label>
          <textarea id="c-message" required></textarea>
          <div class="form-error" id="c-message-error" data-i18n="complaints.messageRequired">الشكوى مطلوبة</div>
        </div>
        <button type="submit" class="btn btn-gold btn-block btn-lg" id="c-submit" data-i18n="complaints.send">إرسال الشكوى عبر واتساب</button>
      </form>
    </section>
  </div>

  <footer class="footer">
    <div class="footer-brand">KERSh KEEPERS</div>
    <div class="footer-slogan">SHAWARMA & GRILL</div>
    <div class="footer-phone">
      <a href="tel:0504802787">0504802787</a> | 
      <a href="https://wa.me/201220776716" target="_blank">01220776716</a>
    </div>
    <div class="footer-copy">
      &copy; 2026 KERSh KEEPERS — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span>
    </div>
  </footer>

  <script src="./data/products.js"></script>
  <script src="./js/language.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/whatsapp.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var form = document.getElementById("complaint-form");
      var submitBtn = document.getElementById("c-submit");

      submitBtn.addEventListener("click", function () {
        var name = document.getElementById("c-name").value.trim();
        var phone = document.getElementById("c-phone").value.trim();
        var orderNum = document.getElementById("c-order").value.trim();
        var message = document.getElementById("c-message").value.trim();

        var valid = true;

        if (!name) {
          document.getElementById("c-name-error").classList.add("show");
          valid = false;
        } else {
          document.getElementById("c-name-error").classList.remove("show");
        }

        if (!phone) {
          document.getElementById("c-phone-error").classList.add("show");
          valid = false;
        } else {
          document.getElementById("c-phone-error").classList.remove("show");
        }

        if (!message) {
          document.getElementById("c-message-error").classList.add("show");
          valid = false;
        } else {
          document.getElementById("c-message-error").classList.remove("show");
        }

        if (!valid) return;

        var msg = buildComplaintMessage({
          name: name,
          phone: phone,
          orderNum: orderNum,
          message: message
        });

        openWhatsApp(msg);
      });
    });
  </script>
</body>
</html>
